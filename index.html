<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilancio SRL</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#66728a;--ln:#dde3ee;--ac:#1f4e9c;--ok:#1a7f4b;--ko:#b3261e;--wa:#a86400}
@media(prefers-color-scheme:dark){:root{--bg:#111722;--card:#1a2232;--tx:#e8edf6;--mu:#93a0b8;--ln:#2b3750;--ac:#6ea0ff;--ok:#4cc38a;--ko:#ff7b72;--wa:#e0a43a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:12px 16px;background:var(--ac);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header small{opacity:.85}
.demo{background:#a86400;color:#fff;padding:6px 16px;font-size:13px}
nav{display:flex;gap:4px;padding:8px 12px;overflow:auto;background:var(--card);border-bottom:1px solid var(--ln)}
nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff}
main{padding:12px 16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mu);font-size:12px}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.t td{font-weight:700}tr.s td{color:var(--mu);font-size:12px}
.neg{color:var(--ko)}.pos{color:var(--ok)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
button.p{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer;margin:10px 6px 0 0}
button.l{background:none;border:1px solid var(--ln);color:var(--tx);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
.ck{display:flex;gap:8px;padding:3px 0;font-size:13px}.ok{color:var(--ok)}.ko{color:var(--ko)}.wa{color:var(--wa)}
.note{font-size:12px;color:var(--mu)}.hid{display:none}

<script src="config.js"></script>
<script>
/* Motore di calcolo Bilancio gestionale SRL. Funzioni pure: stesso file usato dalla pagina e dai test. */
(function (root) {
  var CATEGORIE = [
    { id: 'servizi', nome: 'Servizi a terzi (consulenze)', tipo: 'ricavo' },
    { id: 'vendite', nome: 'Vendite gettoniere e abbonamenti clienti', tipo: 'ricavo' },
    { id: 'intercompany_ricavo', nome: 'Fatture a Paysolution (intercompany)', tipo: 'ricavo' },
    { id: 'acquisti_materiali', nome: 'Acquisti materiali e merci', tipo: 'costo' },
    { id: 'intercompany_costo', nome: 'Fatture da Paysolution (intercompany)', tipo: 'costo' },
    { id: 'trasporti', nome: 'Trasporti e spedizioni', tipo: 'costo' },
    { id: 'pubblicita', nome: 'Pubblicita', tipo: 'costo' },
    { id: 'servizi_prof', nome: 'Commercialista, consulenti e servizi', tipo: 'costo' },
    { id: 'abbonamenti_utenze', nome: 'Abbonamenti, utenze, sicurezza, assicurazioni', tipo: 'costo' },
    { id: 'trasferte_welfare', nome: 'Trasferte, welfare e rappresentanza', tipo: 'costo' },
    { id: 'oneri_bancari', nome: 'Commissioni e oneri bancari', tipo: 'costo' },
    { id: 'compensi_amm', nome: 'Compensi amministratori', tipo: 'costo', irapIndeducibile: true },
    { id: 'stipendi', nome: 'Stipendi', tipo: 'costo', irapIndeducibile: true },
    { id: 'contributi', nome: 'Contributi (INPS ecc.)', tipo: 'costo', irapIndeducibile: true },
    { id: 'f24_ritenute', nome: "F24 ritenute (solo versamento, non e' un costo)", tipo: 'costo', nonCosto: true },
    { id: 'royalties', nome: 'Royalties (a Tullio Serci)', tipo: 'costo' },
    { id: 'ammortamenti', nome: 'Ammortamenti', tipo: 'costo' },
    { id: 'accantonamenti', nome: 'Accantonamenti (TFM, TFR)', tipo: 'costo', irapIndeducibile: true },
    { id: 'oneri_finanziari', nome: 'Interessi e oneri finanziari', tipo: 'costo', irapIndeducibile: true },
    { id: 'altri', nome: 'Altri costi generali', tipo: 'costo' },
    /* Stato patrimoniale: saldi a una data (competenza = mese del saldo). Non entrano nel P&L. riporta = valore ripreso dal saldo precedente se non inserito. */
    { id: 'sp_immob_imm', nome: 'Immobilizzazioni immateriali', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_immob_mat', nome: 'Immobilizzazioni materiali (al netto ammortamenti)', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_rimanenze', nome: 'Rimanenze di magazzino', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_crediti_clienti', nome: 'Crediti verso clienti', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_crediti_soci', nome: 'Crediti verso soci (mutuo)', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_crediti_trib', nome: 'Crediti tributari (IVA, ritenute)', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_altri_crediti', nome: 'Altri crediti e risconti attivi', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_disponibilita', nome: 'Banche e cassa', tipo: 'sp', sezione: 'attivo' },
    { id: 'sp_fondi_tfm', nome: 'Fondi rischi e oneri (TFM amministratori)', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_tfr', nome: 'TFR dipendenti', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_debiti_banche', nome: 'Debiti verso banche e finanziamenti', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_debiti_fornitori', nome: 'Debiti verso fornitori', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_debiti_trib', nome: 'Debiti tributari (IVA, IRES, IRAP, ritenute)', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_debiti_prev', nome: 'Debiti previdenziali e verso il personale', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_altri_debiti', nome: 'Altri debiti e risconti passivi', tipo: 'sp', sezione: 'passivo' },
    { id: 'sp_capitale', nome: 'Capitale sociale', tipo: 'sp', sezione: 'pn', riporta: true },
    { id: 'sp_riserva_legale', nome: 'Riserva legale', tipo: 'sp', sezione: 'pn', riporta: true },
    { id: 'sp_altre_riserve', nome: 'Altre riserve', tipo: 'sp', sezione: 'pn', riporta: true },
    { id: 'sp_utile_prec', nome: 'Utile esercizio precedente (da destinare)', tipo: 'sp', sezione: 'pn', riporta: true }
  ];
  var PARAMS_DEFAULT = {
    inizio: '2026-01', mesi: 12, ires: 24, irap: 3.9,
    ivaPeriodo: 'mensile', includeAcquistiSrl: false, includeDashboard: true, includeRimanenze: true
  };

  function r2(x) { return Math.round((x + Number.EPSILON) * 100) / 100; }
  function mese(d) { return String(d).slice(0, 7); }
  function elencoMesi(inizio, n) {
    var y = +inizio.slice(0, 4), m = +inizio.slice(5, 7), out = [];
    for (var i = 0; i < n; i++) { out.push(y + '-' + (m < 10 ? '0' : '') + m); m++; if (m > 12) { m = 1; y++; } }
    return out;
  }
  function vuoto() { return { ricavi: 0, costi: 0, ivaDeb: 0, ivaCred: 0, irapInded: 0, nonCosto: 0 }; }

  /* Dati comuni dalla Dashboard V6: mese chiuso -> chiusura; altrimenti fatture intercompany approvate. */
  function daDashboard(dash, params) {
    var out = {}, fonte = {}, memo = {};
    function get(m) { return out[m] || (out[m] = vuoto()); }
    var ch = (dash && dash.chiusure) || {};
    Object.keys(ch).forEach(function (m) {
      var c = ch[m], o = get(m);
      o.ricavi += +c.imponibileTSaPS || 0; o.ivaDeb += +c.ivaTSaPS || 0;
      o.costi += +c.imponibilePSaTS || 0; o.ivaCred += +c.ivaPSaTS || 0;
      fonte[m] = 'chiusura';
    });
    ((dash && dash.ic) || []).forEach(function (r) {
      var m = mese(r.data);
      if (ch[m]) return;
      if (r.stato && r.stato !== 'approvato' && r.stato !== 'migrato_v2') return;
      var o = get(m), net = +r.netto || +r.imp || 0, iva = +r.iva || 0;
      if (r.dir === 'srl-srls') { o.ricavi += net; o.ivaDeb += iva; }
      else if (r.dir === 'srls-srl') { o.costi += net; o.ivaCred += iva; }
      else return;
      fonte[m] = fonte[m] || 'fatture intercompany';
    });
    ((dash && dash.acquistiSrl) || []).forEach(function (r) {
      var m = mese(r.data), net = +r.netto || 0, iva = r.ivaFlag === 'inclusa' ? (+r.importo || 0) - net : 0;
      memo[m] = (memo[m] || 0) + net;
      if (params.includeAcquistiSrl) { var o = get(m); o.costi += net; o.ivaCred += iva; }
    });
    return { mesi: out, fonte: fonte, memoAcquisti: memo };
  }

  function calcola(input) {
    var P = Object.assign({}, PARAMS_DEFAULT, input.params || {});
    var cats = {}; (input.categorie || CATEGORIE).forEach(function (c) { cats[c.id] = c; });
    var mesi = elencoMesi(P.inizio, P.mesi), idx = {};
    mesi.forEach(function (m) { idx[m] = true; });
    var dash = daDashboard(P.includeDashboard === false ? {} : input.dash, P);
    var avvisi = [], rows = {};
    var snap = snapshot(input.voci, cats), varRimMese = {}, prevRim = null;
    snap.forEach(function (s) {
      if (s.items.sp_rimanenze === undefined) return;
      if (prevRim !== null && s.m >= P.inizio && P.includeRimanenze !== false) varRimMese[s.m] = (varRimMese[s.m] || 0) + s.items.sp_rimanenze - prevRim;
      prevRim = s.items.sp_rimanenze;
    });
    mesi.forEach(function (m) {
      var d = dash.mesi[m] || vuoto();
      rows[m] = { m: m, fonte: dash.fonte[m] || '', ricaviDash: d.ricavi, costiDash: d.costi,
        ricaviMan: 0, costiMan: 0, ivaDeb: d.ivaDeb, ivaCred: d.ivaCred, irapInded: 0, uscitaNonCosto: 0, cat: {}, varRim: varRimMese[m] || 0 };
    });
    Object.keys(dash.mesi).forEach(function (m) {
      if (!idx[m] && (dash.mesi[m].ricavi || dash.mesi[m].costi)) avvisi.push('Dati Dashboard fuori periodo (' + m + ') non conteggiati');
    });
    (input.voci || []).forEach(function (v) {
      if (v.eliminata) return;
      var m = mese(v.competenza), c = cats[v.categoria];
      if (c && c.tipo === 'sp') return;
      if (!c) { avvisi.push('Voce con categoria sconosciuta: ' + v.id); return; }
      if (!idx[m]) { avvisi.push('Voce fuori periodo (' + m + '): ' + (v.descrizione || v.id)); return; }
      var imp = +v.imponibile || 0, iva = +v.iva || 0, r = rows[m];
      if (c.nonCosto) { r.uscitaNonCosto += imp + iva; return; }
      if (c.tipo === 'ricavo') { r.ricaviMan += imp; r.ivaDeb += iva; r.cat[v.categoria] = (r.cat[v.categoria] || 0) + imp; }
      else {
        var detr = v.detraibile !== false;
        r.costiMan += imp + (detr ? 0 : iva); r.cat[v.categoria] = (r.cat[v.categoria] || 0) + imp + (detr ? 0 : iva);
        if (detr) r.ivaCred += iva;
        if (c.irapIndeducibile) r.irapInded += imp;
      }
    });
    // P&L, IVA, imposte (stime cumulative)
    var cum = { ricavi: 0, costi: 0, utile: 0, ivaSaldo: 0, inded: 0 }, riporto = 0, accP = 0, prevIres = 0, prevIrap = 0;
    var perLen = P.ivaPeriodo === 'trimestrale' ? 3 : 1;
    var lista = mesi.map(function (m, i) {
      var r = rows[m];
      r.ricavi = r.ricaviDash + r.ricaviMan; r.costi = r.costiDash + r.costiMan;
      r.utile = r.ricavi - r.costi + r.varRim;
      cum.ricavi += r.ricavi; cum.costi += r.costi; cum.utile += r.utile; cum.inded += r.irapInded;
      r.ricaviCum = cum.ricavi; r.costiCum = cum.costi; r.utileCum = cum.utile;
      r.ivaSaldo = r.ivaDeb - r.ivaCred; cum.ivaSaldo += r.ivaSaldo; r.ivaCum = cum.ivaSaldo;
      accP += r.ivaSaldo; r.ivaVersare = 0; r.ivaCreditoRiportato = riporto < 0 ? -riporto : 0;
      var fineP = ((i + 1) % perLen === 0) || i === mesi.length - 1;
      if (fineP) {
        var net = accP + riporto;
        if (net > 0) { r.ivaVersare = net; riporto = 0; } else { riporto = net; }
        r.ivaCreditoRiportato = riporto < 0 ? -riporto : 0; accP = 0;
      }
      var iresCum = Math.max(0, cum.utile) * P.ires / 100;
      var irapBase = cum.utile + cum.inded, irapCum = Math.max(0, irapBase) * P.irap / 100;
      r.irapBaseCum = irapBase; r.iresCum = iresCum; r.irapCum = irapCum;
      r.ires = iresCum - prevIres; r.irap = irapCum - prevIrap; prevIres = iresCum; prevIrap = irapCum;
      r.imposteCum = iresCum + irapCum;
      r.utileNettoCum = cum.utile - r.imposteCum;
      return r;
    });
    var tot = lista.reduce(function (a, r) {
      ['ricavi', 'costi', 'varRim', 'utile', 'ivaDeb', 'ivaCred', 'ivaSaldo', 'ivaVersare', 'ires', 'irap', 'uscitaNonCosto'].forEach(function (k) { a[k] = (a[k] || 0) + r[k]; });
      return a;
    }, {});
    var ult = lista[lista.length - 1] || {};
    tot.imposte = tot.ires + tot.irap; tot.utileNetto = tot.utile - tot.imposte;
    tot.ivaCreditoFinale = ult.ivaCreditoRiportato || 0;
    var memoAcq = Object.keys(dash.memoAcquisti).filter(function (m) { return idx[m]; }).reduce(function (s, m) { return s + dash.memoAcquisti[m]; }, 0);
    var res = { params: P, mesi: lista, totali: tot, avvisi: avvisi, memoAcquistiSrl: memoAcq };
    res.controlli = controlli(res, input, dash);
    return res;
  }

  /* Saldi patrimoniali raggruppati per mese di competenza (una voce = un saldo; piu' voci della stessa categoria si sommano). */
  function snapshot(voci, cats) {
    var by = {};
    (voci || []).forEach(function (v) {
      var c = cats[v.categoria]; if (v.eliminata || !c || c.tipo !== 'sp') return;
      var m = mese(v.competenza); by[m] = by[m] || { m: m, items: {}, voci: [] };
      by[m].items[v.categoria] = (by[m].items[v.categoria] || 0) + (+v.imponibile || 0); by[m].voci.push(v);
    });
    return Object.keys(by).sort().map(function (k) { return by[k]; });
  }

  /* Stato patrimoniale per ogni data inserita. Le voci 'riporta' (capitale, riserve) si riprendono dal saldo precedente.
     Per i saldi dentro il periodo del P&L il risultato d'esercizio (utile dopo imposte stimate, cumulato) chiude il patrimonio netto. */
  function statoPatrimoniale(res, voci, categorie) {
    var cats = {}; (categorie || CATEGORIE).forEach(function (c) { cats[c.id] = c; });
    var snaps = snapshot(voci, cats), prev = null;
    return snaps.map(function (s) {
      var it = Object.assign({}, s.items), riportate = {};
      if (prev) Object.keys(cats).forEach(function (k) {
        if (cats[k].riporta && it[k] === undefined && prev.items[k] !== undefined) { it[k] = prev.items[k]; riportate[k] = true; }
      });
      var sez = { attivo: 0, passivo: 0, pn: 0 };
      Object.keys(it).forEach(function (k) { sez[cats[k].sezione] += it[k]; });
      var apertura = s.m < res.params.inizio, risultato = 0;
      if (!apertura) { res.mesi.forEach(function (r) { if (r.m <= s.m) risultato = r.utileNettoCum; }); }
      var out = { m: s.m, items: it, riportate: riportate, attivo: r2(sez.attivo), passivo: r2(sez.passivo), pn: r2(sez.pn), risultato: r2(risultato), apertura: apertura };
      out.diff = r2(out.attivo - out.passivo - out.pn - out.risultato);
      prev = { items: it };
      return out;
    });
  }

  /* Controlli incrociati: ogni totale deve tornare per una via indipendente. */
  function controlli(res, input, dash) {
    var c = [], L = res.mesi, T = res.totali, eq = function (a, b) { return Math.abs(a - b) < 0.005; };
    function add(n, ok, det) { c.push({ nome: n, ok: !!ok, dettaglio: det || '' }); }
    var uc = L.length ? L[L.length - 1] : {};
    add('Utile cumulato finale = somma utili mensili', eq(uc.utileCum || 0, T.utile));
    add('Ricavi - costi + variazione rimanenze = utile (totale)', eq(T.ricavi - T.costi + T.varRim, T.utile));
    add('Ricavi cumulati finali = totale ricavi', eq(uc.ricaviCum || 0, T.ricavi));
    add('IVA cumulata finale = debito - credito', eq(uc.ivaCum || 0, T.ivaDeb - T.ivaCred));
    add('IVA versata + credito residuo = IVA cumulata', eq(T.ivaVersare - T.ivaCreditoFinale, T.ivaSaldo),
      'Verifica del riporto del credito');
    add('Imposte mensili sommate = imposte cumulate', eq(T.imposte, uc.imposteCum || 0));
    var man = { r: 0, c: 0 };
    var cats = {}; (input.categorie || CATEGORIE).forEach(function (x) { cats[x.id] = x; });
    (input.voci || []).forEach(function (v) {
      var cc = cats[v.categoria]; if (v.eliminata || !cc || cc.nonCosto || cc.tipo === 'sp') return;
      var m = String(v.competenza).slice(0, 7); if (m < res.params.inizio || m > L[L.length - 1].m) return;
      var imp = +v.imponibile || 0, iva = +v.iva || 0;
      if (cc.tipo === 'ricavo') man.r += imp; else man.c += imp + (v.detraibile === false ? iva : 0);
    });
    var sr = L.reduce(function (s, r) { return s + r.ricaviMan; }, 0), sc = L.reduce(function (s, r) { return s + r.costiMan; }, 0);
    add('Ricavi manuali del P&L = somma voci inserite', eq(sr, man.r));
    add('Costi manuali del P&L = somma voci inserite', eq(sc, man.c));
    statoPatrimoniale(res, input.voci, input.categorie).filter(function (s) { return s.apertura; }).forEach(function (s) {
      add('Stato patrimoniale al ' + s.m + ': attivo = passivo + patrimonio netto', eq(s.attivo, s.passivo + s.pn), 'Differenza ' + r2(s.diff) + ' €');
    });
    return c;
  }

  var api = { CATEGORIE: CATEGORIE, PARAMS_DEFAULT: PARAMS_DEFAULT, calcola: calcola, statoPatrimoniale: statoPatrimoniale, daDashboard: daDashboard, elencoMesi: elencoMesi, r2: r2 };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Engine = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
var E = window.Engine;
var IT = new Intl.NumberFormat('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
var eur = function(x){ return IT.format(Math.round((x||0)*100)/100); };
var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var etm = function(m){ return MESI[+m.slice(5,7)-1]+' '+m.slice(2,4); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
var S = {voci:[], config:{}, dash:null, tab:'riepilogo', edit:null, storico:[]};

/* ── Backend: Apps Script reale oppure demo locale ── */
var API = window.BILANCIO_API || '', DEMO = !API, TOKEN = '';
try { TOKEN = sessionStorage.getItem('bsrl_t') || ''; } catch (e) {}
async function call(fn){
  var args = [].slice.call(arguments,1);
  if (DEMO) return demoApi(fn,args);
  var r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args,token:TOKEN})});
  var j = await r.json();
  if (j.error) { if (j.status===401 && fn!=='apiLogin') { esci(); } throw new Error(j.error); }
  return j.data;
}
function esci(){ TOKEN=''; try{sessionStorage.removeItem('bsrl_t');}catch(e){} document.getElementById('nav').innerHTML=''; document.getElementById('utente').textContent=''; mostraLogin(); }
function mostraLogin(msg){ document.getElementById('main').innerHTML='<div class="card" style="max-width:360px;margin:30px auto"><b>Accesso riservato</b><label>Utente</label><input id="l_u" autocomplete="username"><label>Password</label><input id="l_p" type="password" autocomplete="current-password"><button class="p" data-a="login">Entra</button><div id="msg" class="note '+(msg?'ko':'')+'">'+esc(msg||'')+'</div></div>'; }
function demoApi(fn,a){
  var K='bilancioSRL_demo', st; try{ st=JSON.parse(localStorage.getItem(K)); }catch(e){}

    apiDashboard:function(){return SINT.dash;},
    apiSalvaVoce:function(v){ v.totale=+v.imponibile+(+v.iva||0); v.tipo=v.categoria==='servizi'?'ricavo':'costo';

}

  +'<div class="note">Chiusure disponibili: '+(ch.join(', ')||'nessuna')+'. Nota: nei mesi con fatture manuali di ricavo/IVA, i valori Dashboard e manuali si sommano (colonne distinte nel P&L).</div>'; }
function vParam(){ var p=params();
  return '<div class="card"><div class="g"><div><label>Primo mese del P&L</label><input type="month" id="p_inizio" value="'+p.inizio+'"></div><div><label>Numero di mesi</label><input type="number" id="p_mesi" min="1" max="24" value="'+p.mesi+'"></div>'
  +'<div><label>Aliquota IRES %</label><input type="number" step="0.01" id="p_ires" value="'+p.ires+'"></div><div><label>Aliquota IRAP % (da confermare)</label><input type="number" step="0.01" id="p_irap" value="'+p.irap+'"></div>'
  +'<div><label>Liquidazione IVA</label><select id="p_ivaPeriodo"><option value="mensile"'+(p.ivaPeriodo==='mensile'?' selected':'')+'>Mensile</option><option value="trimestrale"'+(p.ivaPeriodo==='trimestrale'?' selected':'')+'>Trimestrale</option></select></div>'
  +'<div><label>Dati Dashboard V6 nel P&L</label><select id="p_dash"><option value="true"'+(p.includeDashboard?' selected':'')+'>Sì (solo se non importi le fatture a Paysolution)</option><option value="false"'+(!p.includeDashboard?' selected':'')+'>No (solo controllo: uso le fatture)</option></select></div>'
  +'<div><label>Variazione rimanenze nel P&L</label><select id="p_rim"><option value="true"'+(p.includeRimanenze?' selected':'')+'>Sì (differenza tra i saldi di magazzino)</option><option value="false"'+(!p.includeRimanenze?' selected':'')+'>No</option></select></div>'
  +'<div><label>Acquisti materiali SRL nel P&L</label><select id="p_inc"><option value="false"'+(!p.includeAcquistiSrl?' selected':'')+'>No (memo)</option><option value="true"'+(p.includeAcquistiSrl?' selected':'')+'>Sì, come costo</option></select></div></div><button class="p" data-a="salvaparam">Salva parametri</button><div id="msg" class="note"></div></div>'; }
function vControlli(r){ return '<div class="card"><b>Controlli incrociati</b>'+r.controlli.map(function(c){return '<div class="ck '+(c.ok?'ok':'ko')+'">'+(c.ok?'✔':'✖')+' '+esc(c.nome)+'</div>';}).join('')+'</div>'; }
function vStorico(){ return '<div class="card tw"><table><tr><th>Quando</th><th>Evento</th><th style="text-align:left">Dettaglio</th></tr>'+(S.storico.map(function(s){return '<tr><td>'+esc(String(s.quando).replace('T',' ').slice(0,16))+'</td><td>'+esc(s.evento)+'</td><td style="text-align:left;white-space:normal">'+esc(String(s.dettaglio||'').slice(0,120))+'</td></tr>';}).join('')||'<tr><td colspan="3">Nessun evento</td></tr>')+'</table></div>'; }

/* ── Azioni ── */
function val(id){ return document.getElementById(id).value; }
function msg(t,ko){ var m=document.getElementById('msg'); if(m){ m.textContent=t; m.className='note '+(ko?'ko':'ok'); } }
async function azione(a,id){
  try{
    if(a==='salva'){ var v={id:(S.edit&&S.edit.id)||'',categoria:val('f_categoria'),data:val('f_data'),competenza:val('f_competenza'),imponibile:+val('f_imponibile'),iva:+val('f_iva')||0,detraibile:val('f_detraibile')==='1',descrizione:val('f_descrizione'),riferimento:val('f_riferimento'),note:val('f_note')};
      if(!v.data||!v.competenza||isNaN(v.imponibile)||val('f_imponibile')===''){ msg('Compila data, competenza e imponibile',1); return; }
      await call('apiSalvaVoce',v); S.edit=null; await ricarica(); }
    else if(a==='mod'){ S.edit=S.voci.filter(function(x){return x.id===id;})[0]; render(); }
    else if(a==='annulla'){ S.edit=null; render(); }
    else if(a==='del'){ if(confirm('Eliminare la voce? Resta nello storico e si può ripristinare.')){ await call('apiEliminaVoce',id,false); await ricarica(); } }
    else if(a==='rip'){ await call('apiEliminaVoce',id,true); await ricarica(); }
    else if(a==='salvaparam'){ S.config=await call('apiSalvaConfig',{inizio:val('p_inizio'),mesi:val('p_mesi'),ires:val('p_ires'),irap:val('p_irap'),ivaPeriodo:val('p_ivaPeriodo'),includeAcquistiSrl:val('p_inc'),includeDashboard:val('p_dash'),includeRimanenze:val('p_rim')}); msg('Parametri salvati'); render(); }
    else if(a==='login'){ var rr=await call('apiLogin',val('l_u'),val('l_p')); TOKEN=rr.token; try{sessionStorage.setItem('bsrl_t',TOKEN);}catch(e){} await avvia(); }
    else if(a==='logout'){ try{await call('apiLogout');}catch(e){} esci(); }
    else if(a==='importa'){ document.getElementById('imp').click(); }
  }catch(e){ msg(e.message,1); }
}
async function ricarica(){ var st=await call('apiStato'); S.voci=st.voci; S.config=st.config||{}; document.getElementById('utente').textContent=st.utente||''; if(S.tab==='storico') S.storico=await call('apiStorico'); render(); }
document.addEventListener('click',function(e){ var t=e.target.closest('[data-t]'); if(t){ S.tab=t.dataset.t; if(S.tab==='storico') call('apiStorico').then(function(x){S.storico=x;render();}); else render(); return; }
  var a=e.target.closest('[data-a]'); if(a) azione(a.dataset.a,a.dataset.id); });
document.addEventListener('change',function(e){ if(e.target.id!=='imp'||!e.target.files[0]) return; var f=e.target.files[0], rd=new FileReader();
  rd.onload=async function(){ try{ var l=JSON.parse(rd.result); if(!Array.isArray(l)) throw new Error('Il file deve contenere un elenco di voci'); var n=await call('apiImportaVoci',l); await ricarica(); render(); msg(typeof n==='object'?('Importate '+n.importate+' voci; '+n.saltate+' gia\' presenti e saltate (anti-duplicati)'):('Importate '+n+' voci')); }catch(x){ msg('Importazione fallita: '+x.message,1); } }; rd.readAsText(f); });
async function avvia(){ try{ if(DEMO) document.getElementById('demo').classList.remove('hid'); document.getElementById('exit').classList.toggle('hid',DEMO); await ricarica(); S.dash=await call('apiDashboard'); render(); }catch(e){ if(!TOKEN&&!DEMO) mostraLogin(e.message); else document.getElementById('main').innerHTML='<div class="card ko">'+esc(e.message)+'</div>'; } }
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&document.getElementById('l_p')===document.activeElement) azione('login'); });
if (DEMO || TOKEN) avvia(); else { document.getElementById('exit').classList.add('hid'); mostraLogin(); }
</script></body></html>
