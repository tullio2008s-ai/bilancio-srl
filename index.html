<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilancio SRL</title>
<style>

.demo{background:#a86400;color:#fff;padding:6px 16px;font-size:13px}

main{padding:12px 16px;max-width:1760px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mu);font-size:12px}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}

tr.t td{font-weight:700}tr.s td{color:var(--mu);font-size:12px}
.neg{color:var(--ko)}.pos{color:var(--ok)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}

.card.tw{overflow-x:auto;padding:10px}

tr.tt td{font-weight:700;background:var(--bg);border-top:2px solid var(--ln)}
.bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:8px}.bar .note{margin-right:auto}
.pdfhead{display:none}
body.pdfmode{background:#fff;color:#1b2433;--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#66728a;--ln:#dde3ee;--ac:#1f4e9c;--ok:#1a7f4b;--ko:#b3261e;--wa:#a86400}
body.pdfmode header,body.pdfmode nav,body.pdfmode .bar,body.pdfmode .demo{display:none!important}
body.pdfmode main{max-width:none;width:1500px;margin:0;padding:10px}body.pdfmode .tw,body.pdfmode .card.tw{overflow:visible}
body.pdfmode table.fit{min-width:0;font-size:12px}body.pdfmode td.mod input{border:0;background:none;padding:0}body.pdfmode table.fit th,body.pdfmode table.fit td{padding:3px 5px}body.pdfmode table.fit th:first-child,body.pdfmode table.fit td:first-child{width:20%}body.pdfmode .card{break-inside:avoid}body.pdfmode .pbk{break-before:page;page-break-before:always}

html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{border:0;border-radius:0;padding:0 0 6px;margin-bottom:6px;break-inside:avoid;page-break-inside:avoid}
table.fit{min-width:0;font-size:9.4px}td.mod input{border:0;background:none;padding:0}table.fit th,table.fit td{padding:2.5px 3px}table.fit th:first-child,table.fit td:first-child{width:19%}table.fit thead{display:table-header-group}table.fit tr{break-inside:avoid;page-break-inside:avoid}
.pbk{break-before:page;page-break-before:always}}
.note{font-size:12px;color:var(--mu)}.hid{display:none}

  var perPrel=u.prelievi.map(function(p){ return '<tr><td style="text-align:left">'+dmy(p.data)+'</td><td>'+dmy(p.f24Data)+'</td><td>'+eur(p.lordo)+'</td><td>'+eur(p.ritenuta)+'</td><td><b>'+eur(p.netto)+'</b></td>'+p.soci.map(function(x){return '<td>'+eur(x.netto)+'</td>';}).join('')+'</tr>'; }).join('');
  var tab=u.soci.map(function(x){ return '<tr><td style="text-align:left">'+esc(x.nome)+'</td><td>'+eur(x.cap)+' %</td><td>'+eur(x.div)+' %</td><td>'+eur(x.lordo)+'</td><td>'+eur(x.ritenuta)+'</td><td><b>'+eur(x.netto)+'</b></td></tr>'; }).join('');
  var eff=t.utile>0?u.caricoFiscale/t.utile*100:0, nettoSoci=t.utile>0?(t.utile-u.impostePatrimoniali)/t.utile*(1-u.ritenutaPerc/100)*100:0;
  return (u.avvisi.length?'<div class="card wa">'+u.avvisi.map(esc).join('<br>')+'</div>':'')
   +'<div class="card"><b>Utili, prelievi e ritenute mese per mese</b>'+graficoUtili(u)
   +'<div class="note">'+(prima?'L\'utile 2026 dopo imposte (cumulato) è positivo da <b>'+etm(prima.m)+'</b>: '+(u.riserveLibere?'con le riserve libere ('+eur(u.riserveLibere)+' €) il distribuibile esiste già dall\'inizio dell\'anno.':'da quel mese puoi prelevare.'):'Nessun mese con utile 2026 cumulato positivo.')+' Il prelievo si fa con delibera dei soci e solo su utili risultanti da bilancio approvato (o riserve libere): un prelievo prima dell\'approvazione del bilancio 2026 è un acconto, da condividere con il commercialista.</div></div>'
   +'<div class="card tw"><table class="fit"><thead><tr><th style="text-align:left">€ · PIANO MENSILE</th>'+head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+piano.join('')+'</tbody></table></div>'
   +'<div class="card"><b>Suddivisione dei prelievi</b>'+suddivisione(u)+'</div>'
   +(u.prelievi.length?'<div class="card tw"><b>Per ogni prelievo: soci, ritenuta e data F24</b><table><tr><th style="text-align:left">Data prelievo</th><th>F24 ritenuta entro</th><th>Lordo €</th><th>Ritenuta €</th><th>Netto €</th>'+nomi+'</tr>'+perPrel+'</table></div>':'')
   +'<div class="card tw"><b>Totale per socio</b><table><tr><th style="text-align:left">Socio</th><th>Capitale</th><th>Dividendo</th><th>Lordo €</th><th>Ritenuta €</th><th>Netto al socio €</th></tr>'+tab
   +'<tr class="t"><td style="text-align:left">Totale</td><td></td><td></td><td>'+eur(u.dividendo)+'</td><td>'+eur(u.totRitenuta)+'</td><td>'+eur(u.totNetto)+'</td></tr></table></div>'
   +'<div class="card tw"><table><tr><td style="text-align:left">Utile dopo imposte a fine anno (simulato)</td><td>'+eur(u.utileNetto)+'</td></tr>'
   +'<tr><td style="text-align:left">− a riserva legale (5%, fino al 20% del capitale; oggi '+eur(u.riservaLegale)+' su '+eur(u.capitale)+')</td><td>'+eur(u.accantonamentoLegale)+'</td></tr>'
   +'<tr><td style="text-align:left">+ riserve disponibili (altre riserve + utile 2025)</td><td>'+eur(u.riserveLibere)+'</td></tr>'
   +'<tr class="t"><td style="text-align:left">Massimo distribuibile a fine anno</td><td>'+eur(u.distribuibile)+'</td></tr>'
   +'<tr><td style="text-align:left">Cassa a fine periodo dopo dividendi netti e ritenute pagate nel periodo</td><td class="'+cls(u.cassaFinePeriodo)+'">'+eur(u.cassaFinePeriodo)+'</td></tr>'
   +'<tr><td style="text-align:left">Cassa dopo anche le ritenute da versare dopo il periodo (F24 16/01)</td><td class="'+cls(u.cassaDopoRitenuta)+'">'+eur(u.cassaDopoRitenuta)+'</td></tr></table></div>'
   +'<div class="card"><b>Tasse complessive sugli utili</b><div class="tw"><table><tr><td style="text-align:left">IRES + IRAP della società (stima)</td><td>'+eur(u.impostePatrimoniali)+'</td></tr><tr><td style="text-align:left">Ritenute sui dividendi (a titolo d\'imposta)</td><td>'+eur(u.totRitenuta)+'</td></tr><tr class="t"><td style="text-align:left">Totale tasse</td><td>'+eur(u.caricoFiscale)+'</td></tr>'
   +'<tr><td style="text-align:left">Su 100 € di utile ante imposte, se distribuiti tutti, restano ai soci</td><td>'+eur(nettoSoci)+' €</td></tr></table></div>'
   +'<div class="note">Stime a ipotesi: IRES/IRAP come nella scheda Imposte; ritenuta sui dividendi alle persone fisiche versata dalla società con F24. Compensi, royalties e mutuo ai soci non sono inclusi. Da confermare con il commercialista prima di deliberare.'+(eff?' Incidenza delle tasse societarie e personali: '+eur(eff)+' % dell\'utile ante imposte (a distribuzione completa solo se il dividendo = utile dopo imposte).':'')+'</div></div>'
   +cashFlowHtml(o); }
function r2x(P,k){ return Math.round(P.reduce(function(a,x){return a+(x[k]||0);},0)*100)/100; }
function vDash(r){ var d=S.dash||{}, ch=Object.keys(d.chiusure||{}).sort();
  return '<div class="card"><b>Dati letti dalla Dashboard V6 (sola lettura)</b><div class="note">Letti il '+esc(d.letto_il||'—')+'. Mese con chiusura = valori della chiusura (immutabili); mesi senza chiusura = fatture intercompany approvate.</div></div>'
  +'<div class="card tw"><table><tr><th>Mese</th><th>Ricavi TS→PS (imponibile)</th><th>IVA debito</th><th>Costi PS→TS (imponibile)</th><th>IVA credito</th><th>Fonte</th></tr>'
  +r.mesi.map(function(m){return '<tr><td>'+etm(m.m)+'</td><td>'+eur(m.ricaviDash)+'</td><td>'+eur(m.ivaDeb)+'</td><td>'+eur(m.costiDash)+'</td><td>'+eur(m.ivaCred)+'</td><td>'+esc(m.fonte)+'</td></tr>';}).join('')+'</table></div>'
  +'<div class="note">Chiusure disponibili: '+(ch.join(', ')||'nessuna')+'. Nota: nei mesi con fatture manuali di ricavo/IVA, i valori Dashboard e manuali si sommano (colonne distinte nel P&L).</div>'; }
function vParam(){ var p=params();
  return '<div class="card"><div class="g"><div><label>Primo mese del P&L</label><input type="month" id="p_inizio" value="'+p.inizio+'"></div><div><label>Numero di mesi</label><input type="number" id="p_mesi" min="1" max="24" value="'+p.mesi+'"></div>'
  +'<div><label>Aliquota IRES %</label><input type="number" step="0.01" id="p_ires" value="'+p.ires+'"></div><div><label>Aliquota IRAP % (da confermare)</label><input type="number" step="0.01" id="p_irap" value="'+p.irap+'"></div>'
  +'<div><label>Liquidazione IVA</label><select id="p_ivaPeriodo"><option value="mensile"'+(p.ivaPeriodo==='mensile'?' selected':'')+'>Mensile</option><option value="trimestrale"'+(p.ivaPeriodo==='trimestrale'?' selected':'')+'>Trimestrale</option></select></div>'
  +'<div><label>Dati Dashboard V6 nel P&L</label><select id="p_dash"><option value="true"'+(p.includeDashboard?' selected':'')+'>Sì (solo se non importi le fatture a Paysolution)</option><option value="false"'+(!p.includeDashboard?' selected':'')+'>No (solo controllo: uso le fatture)</option></select></div>'
  +'<div><label>Variazione rimanenze nel P&L</label><select id="p_rim"><option value="true"'+(p.includeRimanenze?' selected':'')+'>Sì (differenza tra i saldi di magazzino)</option><option value="false"'+(!p.includeRimanenze?' selected':'')+'>No</option></select></div>'
  +'<div><label>Acquisti materiali SRL nel P&L</label><select id="p_inc"><option value="false"'+(!p.includeAcquistiSrl?' selected':'')+'>No (memo)</option><option value="true"'+(p.includeAcquistiSrl?' selected':'')+'>Sì, come costo</option></select></div></div><button class="p" data-a="salvaparam">Salva parametri</button><div id="msg" class="note"></div></div>'; }
function vControlli(r){ return '<div class="card"><b>Controlli incrociati</b>'+r.controlli.map(function(c){return '<div class="ck '+(c.ok?'ok':'ko')+'">'+(c.ok?'✔':'✖')+' '+esc(c.nome)+(!c.ok&&c.dettaglio?' — <span class="note">'+esc(c.dettaglio)+'</span>':'')+'</div>';}).join('')+'</div>'; }
function vStorico(){ return '<div class="card tw"><table><tr><th>Quando</th><th>Evento</th><th style="text-align:left">Dettaglio</th></tr>'+(S.storico.map(function(s){return '<tr><td>'+esc(String(s.quando).replace('T',' ').slice(0,16))+'</td><td>'+esc(s.evento)+'</td><td style="text-align:left;white-space:normal">'+esc(String(s.dettaglio||'').slice(0,120))+'</td></tr>';}).join('')||'<tr><td colspan="3">Nessun evento</td></tr>')+'</table></div>'; }

/* ── Azioni ── */
function val(id){ return document.getElementById(id).value; }
function caricaLib(){ return new Promise(function(ok,ko){ if(window.html2pdf) return ok(); var sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; sc.onload=ok; sc.onerror=function(){ko(new Error('libreria PDF non raggiungibile'));}; document.head.appendChild(sc); }); }
async function salvaPdf(){ var pm=document.getElementById('pdfmsg'), nome='Bilancio_SRL_'+S.tab+'_'+new Date().toISOString().slice(0,10)+'.pdf';
  try{
    if((S.tab==='simulazione'||S.tab==='utili')&&!DEMO){ S.config=await call('apiSalvaConfig',{sim:JSON.stringify(simS())}); }
    if(pm){ pm.textContent='Preparo il PDF…'; pm.className='note'; }
    await caricaLib(); document.body.classList.add('pdfmode');
    var el=document.getElementById('main'); await new Promise(function(r){setTimeout(r,150);});
    await html2pdf().set({margin:[6,6,6,6],filename:nome,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,backgroundColor:'#ffffff',windowWidth:1520},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy'],avoid:['tr','.card']}}).from(el).save();
    document.body.classList.remove('pdfmode'); if(pm){ pm.textContent=(S.tab==='simulazione'||S.tab==='utili'?'Simulazione salvata · ':'')+'PDF scaricato: '+nome; pm.className='note ok'; }
  }catch(e){ document.body.classList.remove('pdfmode'); if(pm){ pm.textContent='Download diretto non riuscito ('+e.message+'): apro la stampa, scegli "Salva come PDF".'; pm.className='note ko'; } setTimeout(function(){ window.print(); },400); } }
function msg(t,ko){ var m=document.getElementById('msg'); if(m){ m.textContent=t; m.className='note '+(ko?'ko':'ok'); } }
async function azione(a,id){
  try{
    if(a==='salva'){ var v={id:(S.edit&&S.edit.id)||'',categoria:val('f_categoria'),data:val('f_data'),competenza:val('f_competenza'),imponibile:+val('f_imponibile'),iva:+val('f_iva')||0,detraibile:val('f_detraibile')==='1',descrizione:val('f_descrizione'),riferimento:val('f_riferimento'),note:val('f_note')};
      if(!v.data||!v.competenza||isNaN(v.imponibile)||val('f_imponibile')===''){ msg('Compila data, competenza e imponibile',1); return; }
      await call('apiSalvaVoce',voceVersoServer(v)); S.edit=null; await ricarica(); }
    else if(a==='mod'){ S.edit=S.voci.filter(function(x){return x.id===id;})[0]; render(); }
    else if(a==='annulla'){ S.edit=null; render(); }
    else if(a==='del'){ if(confirm('Eliminare la voce? Resta nello storico e si può ripristinare.')){ await call('apiEliminaVoce',id,false); await ricarica(); } }
    else if(a==='rip'){ await call('apiEliminaVoce',id,true); await ricarica(); }
    else if(a==='bulkdel'){ var L=bulkVoci(val('b_cat'),val('b_da'),val('b_a')); if(!L.length){ msg('Nessuna voce corrisponde',1); return; }
      var tt=L.reduce(function(s,v){return s+(+v.imponibile||0);},0);
      if(!confirm('Eliminare '+L.length+' voci (imponibile totale '+eur(tt)+' €)? Restano nello storico e si possono ripristinare una per una.')) return;
      for(var i=0;i<L.length;i++){ var bi=document.getElementById('b_info'); if(bi) bi.textContent='Elimino '+(i+1)+' di '+L.length+'…'; await call('apiEliminaVoce',L[i].id,false); }
      await ricarica(); msg('Eliminate '+L.length+' voci'); }
    else if(a==='salvaparam'){ S.config=await call('apiSalvaConfig',{inizio:val('p_inizio'),mesi:val('p_mesi'),ires:val('p_ires'),irap:val('p_irap'),ivaPeriodo:val('p_ivaPeriodo'),includeAcquistiSrl:val('p_inc'),includeDashboard:val('p_dash'),includeRimanenze:val('p_rim')}); msg('Parametri salvati'); render(); }
    else if(a==='login'){ var rr=await call('apiLogin',val('l_u'),val('l_p')); TOKEN=rr.token; try{sessionStorage.setItem('bsrl_t',TOKEN);}catch(e){} await avvia(); }
    else if(a==='logout'){ try{await call('apiLogout');}catch(e){} esci(); }
    else if(a==='plprev'){ S.plPrev=(S.plPrev===false); render(); }
    else if(a==='simzero'){ var z=simS(); Object.keys(z.righe).forEach(function(k){ z.righe[k]=z.righe[k].map(function(){return 0;}); }); render(); msg('Previsione azzerata: premi "Salva previsione" per conservarla'); }
    else if(a==='addprel'){ var sp=simS(); sp.prelievi.push({data:sp.mesi[sp.mesi.length-1]+'-18',lordo:0}); render(); }
    else if(a==='delprel'){ simS().prelievi.splice(+id,1); render(); }
    else if(a==='simreset'){ S.sim=E.simNorm(E.SCENARIO); render(); msg('Scenario ripristinato: premi "Salva previsione" per conservarlo'); }
    else if(a==='salvasim'){ S.config=await call('apiSalvaConfig',{sim:JSON.stringify(simS())}); msg('Previsione salvata'); }
    else if(a==='pdf'){ await salvaPdf(); }
    else if(a==='importa'){ document.getElementById('imp').click(); }
  }catch(e){ msg(e.message,1); }
}
async function ricarica(){ var st=await call('apiStato'); S.voci=(st.voci||[]).map(voceDaServer); S.config=st.config||{}; document.getElementById('utente').textContent=st.utente||''; if(S.tab==='storico') S.storico=await call('apiStorico'); render(); }
document.addEventListener('click',function(e){ var t=e.target.closest('[data-t]'); if(t){ S.tab=t.dataset.t; if(S.tab==='storico') call('apiStorico').then(function(x){S.storico=x;render();}); else render(); return; }
  var a=e.target.closest('[data-a]'); if(a) azione(a.dataset.a,a.dataset.id); });
function simAgg(e){ var p=e.target.dataset&&e.target.dataset.sim; if(!p) return; var v=e.target.value; if(p==='usaRiserve'||p==='laser.attiva') v=(v==='1'); else if(!/\.nome$/.test(p)) v=v===''?'':v; simPath(p,v); var d=document.getElementById('simres'); if(d) d.innerHTML=simRes(S.tab); var k=document.getElementById('simkpi'); if(k) k.innerHTML=simKpi(); }
document.addEventListener('input',simAgg); document.addEventListener('change',simAgg);
document.addEventListener('change',function(e){ var k=e.target.dataset&&e.target.dataset.pl; if(!k) return; var q=k.split('|'); plSet(q[0],q[1],e.target.value); plSalva(); clearTimeout(plRT); plRT=setTimeout(plRender,350); });
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.pl){ e.target.blur(); } });
document.addEventListener('change',function(e){ if(e.target.id&&e.target.id.indexOf('b_')===0) bulkInfo(); });
document.addEventListener('change',function(e){ if(e.target.id!=='imp'||!e.target.files[0]) return; var f=e.target.files[0], rd=new FileReader();
  rd.onload=async function(){ try{ var l=JSON.parse(rd.result); if(!Array.isArray(l)) throw new Error('Il file deve contenere un elenco di voci'); var n=await call('apiImportaVoci',l.map(voceVersoServer)); await ricarica(); render(); msg(typeof n==='object'?('Importate '+n.importate+' voci; '+n.saltate+' gia\' presenti e saltate (anti-duplicati)'):('Importate '+n+' voci')); }catch(x){ msg('Importazione fallita: '+x.message,1); } }; rd.readAsText(f); });
async function avvia(){ try{ if(DEMO) document.getElementById('demo').classList.remove('hid'); document.getElementById('exit').classList.toggle('hid',DEMO); await ricarica(); S.dash=await call('apiDashboard'); render(); }catch(e){ if(!TOKEN&&!DEMO) mostraLogin(e.message); else document.getElementById('main').innerHTML='<div class="card ko">'+esc(e.message)+'</div>'; } }
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&document.getElementById('l_p')===document.activeElement) azione('login'); });
if (DEMO || TOKEN) avvia(); else { document.getElementById('exit').classList.add('hid'); mostraLogin(); }
</script></body></html>
