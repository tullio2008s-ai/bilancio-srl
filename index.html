  /* Dati comuni dalla Dashboard V6: mese chiuso -> chiusura; altrimenti fatture intercompany approvate. */
  function daDashboard(dash, params) {
    var out = {}, fonte = {}, memo = {};
    function get(m) { return out[m] || (out[m] = vuoto()); }

    });
    ((dash && dash.ic) || []).forEach(function (r) {
      var m = mese(r.data);

    var cats = {}; (input.categorie || CATEGORIE).forEach(function (c) { cats[c.id] = c; });
